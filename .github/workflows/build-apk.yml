name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже установлен на раннерах GitHub (ANDROID_HOME)
      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: ArticleScanner-apk
          path: app/build/outputs/apk/release/*.apk

      # Готовый APK (или лог ошибки) кладём в ветку "apk" — оттуда его удобно скачать
      - name: Publish to branch apk
        if: always()
        run: |
          mkdir -p /tmp/out
          tail -n 400 build.log > /tmp/out/build.log || true
          echo "${{ steps.build.outcome }} ${{ github.sha }}" > /tmp/out/STATUS.txt
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk /tmp/out/ArticleScanner-arm64.apk 2>/dev/null || true
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk /tmp/out/ArticleScanner-armv7.apk 2>/dev/null || true
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${{ github.sha }}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
